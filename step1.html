<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Your Design - SuperRank</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="styleguide.css">
    <link rel="stylesheet" href="step1-styles.css">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon/favicon-dark@2x.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon/favicon-dark.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/favicon/favicon-dark@4x.png">
    
    <!-- SF Pro fonts loaded locally -->
</head>
<body class="upload-flow">
    <div class="top-right-nav">
        <!-- Top Right Close Button -->
        <button class="component-close-button" id="topCloseButton">
            <img src="assets/images/icon-close-white.png" alt="Close" class="component-close-icon">
        </button>
    </div>

    <div class="upload-container">
        <!-- Main Title -->
        <div class="component-big-title">
            <h1>Oh, so you think you're the sh*t?!</h1>
        </div>

        <!-- Upload Button -->
        <div class="upload-section">
            <button class="component-action-button white" id="uploadButton">
                <!-- Default state icon -->
                <div class="upload-icon upload-icon-default">
                    <img src="assets/images/icon-imgplus-black.png" alt="Upload images" class="upload-icon-img">
                </div>

                
                
            </button>
            <input type="file" id="fileInput" accept="image/*" style="display: none;">
        </div>


    
    <script src="step1-script.js"></script>
</body>
</html>
