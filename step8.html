<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon - SuperRank</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="styleguide.css">
    <link rel="stylesheet" href="step8-styles.css">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon/favicon-dark@2x.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon/favicon-dark.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/favicon/favicon-dark@4x.png">
    
    <!-- SF Pro fonts loaded locally -->
</head>
<body class="upload-flow">
    <!-- Top Right Navigation -->
    <div class="top-right-nav">
        <!-- Logo -->
        <div class="nav-logo">
            <img src="assets/images/SuperLogo.png" alt="SuperRank" class="logo-image">
        </div>
        
        <!-- Close Button -->
        <button class="component-action-button" id="closeButton">
            <img src="assets/images/icon-close.png" alt="Close" class="component-action-button-icon">
        </button>
    </div>

    <div class="upload-container">
        <!-- Step Subtitle -->
        <div class="subtitle-feedback">
            <span>We're rolling out invites for the closed beta at the moment, check your inbox!</span>
        </div>
        
        <!-- Main Title -->
        <div class="component-big-title">
            <h1>Share with designers</h1>
        </div>
        
        <!-- Share Components -->
        <div class="share-section">
            <div class="share-buttons">
                <button class="share-button" id="shareCopy">
                    <img src="assets/images/icon-clipboard-white.png" alt="Copy Link" class="share-icon">
                    <span>Copy Link</span>
                </button>

                <button class="share-button" id="shareTwitter">
                    <img src="assets/images/twitterlogo.png" alt="Twitter" class="share-icon">
                    <span>Tweet it</span>
                </button>
                
                <button class="share-button" id="shareLinkedIn">
                    <svg class="share-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <circle cx="12" cy="12" r="12" fill="#0A66C2"/>
                        <rect x="7.2" y="9.2" width="2.1" height="7.2" fill="#FFFFFF" rx="1"/>
                        <circle cx="8.25" cy="7.25" r="1.25" fill="#FFFFFF"/>
                        <path d="M12 9.2h2.1v1.05c.5-.8 1.3-1.25 2.45-1.25 2 0 3.45 1.25 3.45 3.75v3.75H17.9v-3.2c0-1.15-.55-1.85-1.6-1.85-.95 0-1.55.6-1.7 1.3-.05.15-.05.35-.05.55v3.2H12V9.2z" fill="#FFFFFF"/>
                    </svg>
                    <span>Linked it</span>
                </button>
                
                <button class="share-button" id="shareWhatsApp">
                    <img src="assets/images/WAlogo.png" alt="WhatsApp" class="share-icon">
                    <span>Send it</span>
                </button>
                

            </div>
        </div>
    </div>

    <script src="step8-script.js"></script>
</body>
</html>
